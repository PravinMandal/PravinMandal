  <rect x="330" y="306" width="180" height="130" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <text x="350" y="338" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">API</text>
  <text x="350" y="366" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">stagger</text>
  <text x="350" y="388" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">insert rows</text>
  <text x="350" y="410" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">enqueue jobs</text>

  <path d="M510 340 L560 300" stroke="#5B6675" stroke-width="1.5"/><path d="M553 296 L560 300 L553 304" stroke="#5B6675" stroke-width="1.5" fill="none"/>
  <path d="M510 400 L560 430" stroke="#5B6675" stroke-width="1.5"/><path d="M553 426 L560 430 L553 434" stroke="#5B6675" stroke-width="1.5" fill="none"/>

  <!-- postgres -->
  <rect x="560" y="238" width="238" height="120" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <rect x="560" y="238" width="3" height="120" rx="1.5" fill="#7AA2F7"/>
  <text x="580" y="270" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">Postgres</text>
  <text x="580" y="298" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">source of truth</text>
  <text x="580" y="322" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7AA2F7" text-anchor="start" letter-spacing="0" opacity="1">row id  =  job id</text>

  <!-- redis -->
  <rect x="560" y="392" width="238" height="130" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <rect x="560" y="392" width="3" height="130" rx="1.5" fill="#FFB86B"/>
  <text x="580" y="424" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">Redis / BullMQ</text>
  <text x="580" y="452" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">delayed jobs</text>
  <text x="580" y="476" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#FFB86B" text-anchor="start" letter-spacing="0" opacity="1">atomic Lua quotas</text>
  <text x="580" y="500" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5B6675" text-anchor="start" letter-spacing="0" opacity="1">no cron</text>

  <path d="M798 300 L840 330" stroke="#5B6675" stroke-width="1.5"/><path d="M833 326 L840 330 L833 334" stroke="#5B6675" stroke-width="1.5" fill="none"/>
  <path d="M798 456 L840 420" stroke="#5B6675" stroke-width="1.5"/><path d="M833 416 L840 420 L833 424" stroke="#5B6675" stroke-width="1.5" fill="none"/>

  <!-- worker -->
  <rect x="840" y="270" width="164" height="250" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <text x="860" y="302" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">worker</text>
  <text x="860" y="334" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">claim</text>
  <text x="860" y="358" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">→ send</text>
  <text x="860" y="382" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">→ mark sent</text>
  <line x1="860" y1="404" x2="984" y2="404" stroke="#2C3542"/>
  <text x="860" y="432" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#B7F171" text-anchor="start" letter-spacing="0" opacity="1">compare-and-set</text>
  <text x="860" y="456" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#B7F171" text-anchor="start" letter-spacing="0" opacity="1">sent = no-op</text>
  <text x="860" y="486" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5B6675" text-anchor="start" letter-spacing="0" opacity="1">crash between</text>
  <text x="860" y="504" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5B6675" text-anchor="start" letter-spacing="0" opacity="1">reserve + claim?</text>

  <path d="M1004 395 L1048 395" stroke="#5B6675" stroke-width="1.5"/><path d="M1041 391 L1048 395 L1041 399" stroke="#5B6675" stroke-width="1.5" fill="none"/>

  <!-- smtp -->
  <rect x="1048" y="330" width="104" height="130" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <text x="1100" y="362" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="0" opacity="1">SMTP</text>
  <text x="1100" y="390" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle" letter-spacing="0" opacity="1">Ethereal</text>
  <circle cx="1100" cy="424" r="14" fill="#B7F171" opacity="0.12"/>
  <path d="M1093 424 L1098 429 L1107 419" stroke="#B7F171" stroke-width="2" fill="none"/>
  <text x="1100" y="454" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#5B6675" text-anchor="middle" letter-spacing="0" opacity="1">preview</text>

  <!-- bottom proof strip -->
  <line x1="48" y1="548" x2="1152" y2="548" stroke="#2C3542"/>
  <text x="48" y="586" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5B6675" text-anchor="start" letter-spacing="1.5" opacity="1">PROOF, NOT PROMISES</text>
  <text x="48" y="620" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">restart reconciler</text>
  <text x="48" y="642" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">requeues orphaned rows</text>
  <text x="448" y="620" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">two-layer rate limit</text>
  <text x="448" y="642" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">min gap + hourly quotas</text>
  <text x="848" y="620" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">graceful search</text>
  <text x="848" y="642" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">Elasticsearch → pg_trgm</text>
</svg>