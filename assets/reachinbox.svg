<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" fill="none">
  <defs>
    <clipPath id="frameClip"><rect x="20" y="20" width="1200" height="720" rx="18"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#1A212B" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1240" height="760" fill="#0B0E13"/>
  <rect x="20" y="20" width="1200" height="720" rx="18" fill="#12171F"/>
  <g clip-path="url(#frameClip)">
    <rect x="20" y="20" width="1200" height="44" fill="#161C25"/>
    <circle cx="46" cy="42" r="6" fill="#FF5F57"/>
    <circle cx="68" cy="42" r="6" fill="#FEBC2E"/>
    <circle cx="90" cy="42" r="6" fill="#28C840"/>
    <rect x="385" y="30" width="430" height="24" rx="12" fill="#0D1117"/>
    <circle cx="401" cy="42" r="3" fill="#57AB5A"/>
    <text x="414" y="47" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#8B949E">reachinbox-web.vercel.app</text>
    <rect x="20" y="64" width="1200" height="676" fill="#0B0E13"/>
    <rect x="20" y="64" width="1200" height="676" fill="url(#grid)" opacity="0.55"/>
    <circle cx="1040" cy="160" r="150" fill="#B7F171" opacity="0.035" filter="url(#soft)"/>
    <text x="48" y="138" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#E6EDF3" letter-spacing="-1">ReachInbox</text>
  </g>
  <rect x="20" y="20" width="1200" height="720" rx="18" stroke="#2C3542"/>

  <text x="48" y="176" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#B7F171" text-anchor="start" letter-spacing="0" opacity="1">Campaign scheduler</text>
  <text x="48" y="202" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">One fire time per recipient. One job per row. Restart-safe.</text>

  <!-- campaign -->
  <rect x="48" y="246" width="238" height="250" rx="12" fill="#0F141B" stroke="#2C3542"/>
  <text x="68" y="278" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0" opacity="1">campaign</text>
  <rect x="232" y="262" width="38" height="22" rx="11" fill="#B7F171" opacity="0.12"/>
  <text x="251" y="277" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#B7F171" text-anchor="middle" letter-spacing="0" opacity="1">3</text>
  <text x="68" y="310" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">lead_01  ·  t+0s</text>
  <text x="68" y="336" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">lead_02  ·  t+30s</text>
  <text x="68" y="362" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="0" opacity="1">lead_03  ·  t+60s</text>
  <line x1="68" y1="386" x2="266" y2="386" stroke="#2C3542"/>
  <text x="68" y="414" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#5B6675" text-anchor="start" letter-spacing="0" opacity="1">hourly cap</text>
  <text x="68" y="438" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB86B" text-anchor="start" letter-spacing="0" opacity="1">2 / hour</text>
  <rect x="68" y="458" width="198" height="26" rx="7" fill="#B7F171" opacity="0.12"/>
  <text x="167" y="476" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#B7F171" text-anchor="middle" letter-spacing="0" opacity="1">schedule campaign</text>

  <path d="M286 371 L330 371" stroke="#5B6675" stroke-width="1.5"/><path d="M323 367 L330 371 L323 375" stroke="#5B6675" stroke-width="1.5" fill="none"/>

